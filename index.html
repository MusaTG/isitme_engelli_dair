<!doctype html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duyum – Kendi hızında dinleme pratiği</title>
  <meta name="description" content="İşitme cihazı, koklear implant ve bimodal kullanıcılar için ücretsiz, Türkçe ve İngilizce dinleme pratiği uygulaması.">
  <meta name="theme-color" content="#f3f6fa">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe geç</a>
  <div id="update" class="banner" hidden role="status"></div>
  <div id="offline" class="banner subtle" hidden role="status"></div>
  <div id="storage-warn" class="banner warn" hidden role="alert"></div>

  <header class="app-header">
    <a class="brand" href="#/home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="4.5"/><path d="M16 6.5a9.5 9.5 0 0 1 0 19M16 2a14 14 0 0 1 0 28" fill="none"/></svg>
      <span class="brand-name">Duyum</span>
      <span class="brand-tag">Kendi hızında dinleme pratiği</span>
    </a>
    <div id="profile-chip"></div>
  </header>

  <nav id="nav" class="app-nav" hidden></nav>

  <main id="main" class="view" tabindex="-1">
    <noscript><p>Duyum’u kullanmak için JavaScript’i etkinleştirin. / Please enable JavaScript to use Duyum.</p></noscript>
  </main>

  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
